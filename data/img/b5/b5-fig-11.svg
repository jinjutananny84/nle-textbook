<circle cx="456" cy="232" r="22" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/><circle cx="456" cy="230" r="8" fill="#ea580c" fill-opacity=".5"/>
<path d="M440,253 L440,258" stroke="#ea580c" stroke-width="4"/>
