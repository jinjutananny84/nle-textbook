<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="tp" viewBox="0 0 4 18" refX="2" refY="9" markerWidth="4" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><rect width="4" height="18" fill="#7c3aed"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">แผนที่ยา osteoporosis บน remodeling unit</text>
<text x="20" y="62" font-size="15" fill="#16a34a" font-weight="700" text-anchor="start">Anabolic (กระตุ้นการสร้าง)</text>
<text x="980" y="62" font-size="15" fill="#7c3aed" font-weight="700" text-anchor="end">Antiresorptive (ยับยั้งการสลาย)</text>
<path d="M290,330 L540,330 C552,332 560,352 590,352 L650,352 C675,352 684,332 696,330 L712,330 L712,432 L290,432 Z" fill="#E8DCC0" stroke="#1f2937" stroke-width="1.5"/>
<text x="700" y="424" font-size="13" fill="#1f2937" font-weight="600" text-anchor="end">Bone (hydroxyapatite)</text>
<rect x="310" y="282" width="44" height="46" rx="5" fill="#16a34a" fill-opacity=".18" stroke="#16a34a" stroke-width="2"/>
<ellipse cx="332" cy="314" rx="9" ry="7" fill="#16a34a" fill-opacity=".5"/>
<rect x="358" y="282" width="44" height="46" rx="5" fill="#16a34a" fill-opacity=".18" stroke="#16a34a" stroke-width="2"/>
<ellipse cx="380" cy="314" rx="9" ry="7" fill="#16a34a" fill-opacity=".5"/>
<rect x="406" y="282" width="44" height="46" rx="5" fill="#16a34a" fill-opacity=".18" stroke="#16a34a" stroke-width="2"/>
<ellipse cx="428" cy="314" rx="9" ry="7" fill="#16a34a" fill-opacity=".5"/>
<text x="304" y="302" font-size="13" fill="#16a34a" font-weight="700" text-anchor="end">Osteoblast</text>
