<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">กระดูกหักตรงไหน → เส้นประสาทตรงนั้น (humerus ขวา มองด้านหลัง)</text>
  <text x="140" y="60" font-size="13" fill="#6b7280" text-anchor="middle">medial</text>
  <text x="360" y="60" font-size="13" fill="#6b7280" text-anchor="middle">lateral</text>

  <!-- humerus (posterior view, right): medial = viewer's left -->
  <path d="M190,92 Q192,58 228,56 Q266,56 272,84 Q286,70 306,80 Q318,96 306,128 Q290,150 282,175
           L282,420 Q300,450 330,500 Q348,520 340,540 Q330,556 312,560 L306,585 L214,585 L206,562
           Q182,558 168,548 Q160,536 176,522 Q206,486 238,420 L240,175 Q232,150 214,140 Q190,124 190,92 Z"
        fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <!-- anatomical neck line -->
  <path d="M206,132 Q248,112 262,70" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
  <!-- spiral groove -->
  <path d="M244,210 Q262,280 280,380" fill="none" stroke="#6b7280" stroke-width="7" stroke-opacity=".35" stroke-linecap="round"/>
  <!-- olecranon fossa -->
  <ellipse cx="260" cy="528" rx="24" ry="22" fill="#6b7280" fill-opacity=".2" stroke="#6b7280" stroke-width="1.2"/>
  

  <!-- (1) axillary + PCHA around surgical neck -->
  <path d="M200,176 Q238,190 262,184 Q300,174 326,150" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M198,166 Q236,180 262,174 Q296,164 322,140" fill="none" stroke="#eab308" stroke-width="4.5" marker-end="url(#ay)"/>
  <!-- (2) radial + profunda in spiral groove -->
  <path d="M236,196 Q256,280 274,392 L282,430" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M248,196 Q268,280 286,392 L296,432" fill="none" stroke="#eab308" stroke-width="4.5" marker-end="url(#ay)"/>
  <!-- (3) median + brachial (anterior, dashed) -->
  <path d="M232,380 Q236,450 246,600" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M222,380 Q226,450 236,600" fill="none" stroke="#eab308" stroke-width="4.5" stroke-dasharray="6 4"/>
  <!-- supracondylar fracture -->
  <path d="M232,446 L258,456 L248,462 L290,476" fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- (4) ulnar behind medial epicondyle -->
  <path d="M200,400 Q196,470 190,522 Q188,552 204,568 Q214,584 216,620" fill="none" stroke="#eab308" stroke-width="4.5"/>

  <!-- numbered markers -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="296" cy="166" r="12" fill="#dc2626"/><text x="296" y="171">1</text>
    <circle cx="268" cy="300" r="12" fill="#dc2626"/><text x="268" y="305">2</text>
    <circle cx="300" cy="476" r="12" fill="#dc2626"/><text x="300" y="481">3</text>
    <circle cx="160" cy="532" r="12" fill="#dc2626"/><text x="160" y="537">4</text>
  </g>

  <!-- labels -->
  <g font-size="13" fill="#1f2937">
    <text x="370" y="114" font-weight="700">1 Surgical neck</text>
    <text x="370" y="132">Axillary n. +</text>
    <text x="370" y="148">posterior circumflex humeral a.</text>
    <text x="370" y="258" font-weight="700">2 Spiral groove (กลางแท่ง)</text>
    <text x="370" y="276">Radial n. + profunda brachii a.</text>
    <text x="370" y="398" font-weight="700">3 Supracondylar (เด็ก)</text>
    <text x="370" y="416">Median n./AIN + brachial a.</text>
    <text x="370" y="432" fill="#6b7280">(อยู่ด้านหน้า = เส้นประ)</text>
    <text x="370" y="598" font-weight="700">4 หลัง medial epicondyle</text>
    <text x="370" y="616">Ulnar n. (cubital tunnel)</text>
  </g>
  <g stroke="#6b7280" stroke-width="1" fill="none">
    <path d="M308,162 L364,128"/>
    <path d="M280,298 L364,270"/>
    <path d="M312,474 L364,414"/>
    <path d="M166,543 L196,620 L364,620"/>
  </g>
  <!-- displaced fragment hint -->
  <text x="22" y="440" font-size="13" fill="#dc2626">ชิ้นล่างเลื่อน</text>
  <text x="22" y="456" font-size="13" fill="#dc2626">ไปด้านหลัง</text>
  <line x1="110" y1="450" x2="226" y2="456" stroke="#dc2626" stroke-width="1.2"/>

  <!-- arrows to pictograms -->
  <g stroke="#1f2937" stroke-width="2" marker-end="url(#ak)">
    <line x1="600" y1="132" x2="672" y2="132"/>
    <line x1="600" y1="270" x2="672" y2="270"/>
    <line x1="600" y1="414" x2="672" y2="414"/>
    <line x1="600" y1="606" x2="672" y2="580"/>
  </g>
  <g fill="none" stroke="#6b7280" stroke-width="1">
    <rect x="680" y="76" width="310" height="118" rx="8"/>
    <rect x="680" y="210" width="310" height="118" rx="8"/>
    <rect x="680" y="344" width="310" height="150" rx="8"/>
    <rect x="680" y="504" width="310" height="122" rx="8"/>
  </g>

  <!-- P1 shoulder: flat deltoid + badge -->
  <circle cx="712" cy="98" r="0" fill="none"/><path d="M712,86 L716,112 Q730,118 770,120 L808,126 L818,136 L820,184" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M808,126 Q830,140 826,184" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <ellipse cx="808" cy="156" rx="13" ry="20" fill="#eab308" fill-opacity=".45" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="770" y1="128" x2="780" y2="184" stroke="#6b7280" stroke-width="2"/>
  <g font-size="13" fill="#1f2937">
    <text x="850" y="128" font-weight="700">flat deltoid,</text>
    <text x="850" y="146" font-weight="700">regimental badge</text>
    <text x="850" y="164" fill="#6b7280">(เส้นประ = ปกติ)</text>
  </g>

  <!-- P2 wrist drop -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M694,250 L790,250" stroke="#6b7280" stroke-width="26"/>
    <path d="M694,250 L790,250" stroke="#ffffff" stroke-width="22"/>
  </g>
  <path d="M790,238 Q812,238 820,262 L830,300 Q826,312 814,306 L796,262 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <path d="M818,268 L824,298 M808,268 L816,300" fill="none" stroke="#6b7280" stroke-width="1.3"/>
  <path d="M840,240 Q848,270 836,296" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="866" y="262" font-size="13" font-weight="700" fill="#1f2937">wrist drop</text>
  <text x="866" y="280" font-size="13" fill="#6b7280">ข้อมือ+นิ้วห้อย</text>

  <!-- P3 OK sign fail -->
  <path d="M736,470 L736,420 Q736,410 746,408 L790,408 Q800,410 800,420 L800,470 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <g stroke="#6b7280" stroke-width="2" fill="#ffffff">
    <rect x="768" y="362" width="10" height="48" rx="5"/>
    <rect x="780" y="366" width="10" height="44" rx="5"/>
    <rect x="791" y="374" width="9" height="36" rx="4.5"/>
  </g>
  <!-- straight index + straight thumb: flat pinch -->
  <path d="M752,410 L744,368 L740,360" fill="none" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/>
  <path d="M752,410 L744,368 L740,360" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M736,436 L716,396 L736,362" fill="none" stroke="#6b7280" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M736,436 L716,396 L736,362" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="742" y="488" font-size="13" fill="#dc2626">ไม่เป็นวง O</text>
  <g font-size="13" fill="#1f2937">
    <text x="830" y="396" font-weight="700">OK sign ไม่ได้</text>
    <text x="830" y="414" fill="#6b7280">(AIN: FPL, FDP II)</text>
    <text x="830" y="438" font-weight="700">Volkmann</text>
    <text x="830" y="456" font-weight="700">contracture</text>
    <text x="830" y="474" fill="#6b7280">(brachial a. ขาดเลือด)</text>
  </g>

  <!-- P4 claw ring-little (dorsal view) -->
  <path d="M730,610 L730,562 Q730,552 740,552 L796,552 Q806,552 806,562 L806,610 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <g stroke="#6b7280" stroke-width="2" fill="#ffffff">
    <rect x="740" y="508" width="11" height="46" rx="5.5"/>
    <rect x="753" y="504" width="11" height="50" rx="5.5"/>
  </g>
  <!-- ring + little clawed: short, bent -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M771,554 L774,528 L784,540" stroke="#7c3aed" stroke-width="11"/>
    <path d="M771,554 L774,528 L784,540" stroke="#ffffff" stroke-width="7.5"/>
    <path d="M790,556 L794,534 L802,546" stroke="#7c3aed" stroke-width="10"/>
    <path d="M790,556 L794,534 L802,546" stroke="#ffffff" stroke-width="6.5"/>
  </g>
  <rect x="706" y="572" width="30" height="11" rx="5.5" fill="#ffffff" stroke="#6b7280" stroke-width="2" transform="rotate(-30 734 578)"/>
  <g font-size="13" fill="#1f2937">
    <text x="850" y="550" font-weight="700">claw</text>
    <text x="850" y="568" font-weight="700">นิ้วนาง-ก้อย</text>
    <text x="850" y="586" fill="#6b7280">(+ ชา medial 1½)</text>
  </g>
</svg>
