<text x="22" y="330" font-weight="700" fill="#7c3aed">Tibial n.</text>
<text x="22" y="346" fill="#7c3aed">หลังน่อง</text>
<text x="300" y="166" font-weight="700" fill="#a16207">Common peroneal n.</text>
<text x="300" y="182">เลียบ tendon biceps femoris</text>
<text x="310" y="252" font-weight="700" fill="#dc2626">fibular neck —</text>
<text x="310" y="268" fill="#dc2626">กระแทก/หัก/เฝือกรัด</text>
<text x="310" y="328" font-weight="700" fill="#2563eb">Deep peroneal n.</text>
<text x="310" y="344">→ TA/EHL/EDL</text>
<text x="310" y="360" font-weight="700" fill="#2563eb">dorsiflexion</text>
<text x="310" y="408" font-weight="700" fill="#16a34a">Superficial peroneal n.</text>
<text x="310" y="424">→ fibularis</text>
<text x="310" y="440" font-weight="700" fill="#16a34a">eversion</text>
<text x="310" y="476" fill="#16a34a">ผิว lateral leg + หลังเท้า</text>
<text x="310" y="492" fill="#16a34a">(Superficial peroneal)</text>
