<text x="590" y="88" font-weight="700" fill="#0891b2">Anterior: TA, EHL, EDL</text>
<text x="590" y="104">— deep peroneal n. + anterior tibial a.</text>
<text x="892" y="196" font-weight="700" fill="#16a34a">Lateral:</text>
<text x="892" y="212">fibularis</text>
<text x="892" y="228">longus/brevis —</text>
<text x="892" y="244">superficial</text>
<text x="892" y="260">peroneal n.</text>
<text x="590" y="496" font-weight="700" fill="#ea580c">Deep posterior: TP, FDL, FHL</text>
<text x="590" y="512">— tibial n. + posterior tibial a.</text>
<text x="590" y="538" font-weight="700" fill="#a16207">Superficial posterior:</text>
<text x="590" y="554">gastrocnemius, soleus</text>
