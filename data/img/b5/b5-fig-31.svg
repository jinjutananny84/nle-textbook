<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="5" fill="#1f2937"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">Carpal tunnel, Guyon's canal และ bursa ของฝ่ามือ (มือขวา)</text>
  <line x1="510" y1="44" x2="510" y2="588" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== LEFT: cross-section ===== -->
  <text x="255" y="60" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">ภาพตัดขวางข้อมือ (ด้านฝ่ามืออยู่บน)</text>
  <text x="255" y="82" font-size="13" fill="#6b7280" text-anchor="middle">Palmar</text>
  <text x="255" y="480" font-size="13" fill="#6b7280" text-anchor="middle">Dorsal</text>
  <text x="22" y="280" font-size="13" fill="#6b7280">Radial</text>
  <text x="492" y="280" font-size="13" fill="#6b7280" text-anchor="end">Ulnar</text>

  <!-- lunate ghost (dorsal) -->
  <ellipse cx="255" cy="402" rx="30" ry="20" fill="#6b7280" fill-opacity=".2" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="420" font-size="13" fill="#6b7280">lunate</text>

  <!-- carpal arch (U) -->
  <g fill="#E8DCC0" stroke="#6b7280" stroke-width="2">
    <path d="M86,206 Q78,190 96,184 Q116,182 122,200 L132,250 Q128,276 104,276 Q80,270 82,246 Z"/>
    <path d="M136,262 Q140,240 166,246 Q190,256 194,290 Q190,316 166,314 Q140,306 136,290 Z"/>
    <path d="M200,300 Q206,280 255,282 Q304,280 310,300 Q312,350 255,354 Q198,350 200,300 Z"/>
    <path d="M316,290 Q320,256 344,246 Q362,234 376,226 L388,200 Q400,192 406,204 L404,236 Q398,290 372,312 Q340,322 320,312 Z"/>
    <ellipse cx="440" cy="200" rx="22" ry="18"/>
  </g>
  <g font-size="13" fill="#1f2937">
    <text x="255" y="324" text-anchor="middle" fill="#6b7280">capitate</text>
  </g>

  <!-- flexor retinaculum -->
  <path d="M100,186 Q250,120 398,196" fill="none" stroke="#2563eb" stroke-width="7"/>
  <!-- Guyon's canal -->
  <path d="M398,196 Q404,150 440,152 Q470,156 460,186" fill="#6b7280" fill-opacity=".08" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="420" cy="172" r="9" fill="#eab308" stroke="#a16207" stroke-width="1.5"/>
  <circle cx="442" cy="168" r="7" fill="#dc2626" fill-opacity=".85"/>

  <!-- tunnel contents -->
  <circle cx="190" cy="182" r="16" fill="#eab308" stroke="#a16207" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
    <circle cx="150" cy="214" r="15"/>
    <circle cx="232" cy="190" r="15"/><circle cx="266" cy="184" r="15"/><circle cx="300" cy="188" r="15"/><circle cx="334" cy="198" r="15"/>
    <circle cx="198" cy="242" r="15"/><circle cx="234" cy="248" r="15"/><circle cx="270" cy="248" r="15"/><circle cx="306" cy="242" r="15"/>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">
    <text x="150" y="219">FPL</text>
    <text x="232" y="195">FDS</text><text x="266" y="189">FDS</text><text x="300" y="193">FDS</text><text x="334" y="203">FDS</text>
    <text x="198" y="247">FDP</text><text x="234" y="253">FDP</text><text x="270" y="253">FDP</text><text x="306" y="247">FDP</text>
  </g>

  <!-- lunate push arrow -->
  <line x1="255" y1="450" x2="255" y2="370" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ar)"/>

  <!-- labels -->
  <g font-size="13" fill="#1f2937">
    <text x="60" y="112" font-weight="700" fill="#2563eb">Flexor retinaculum</text>
    <text x="28" y="148" font-weight="700" fill="#a16207">Median n.</text>
    <text x="22" y="320">scaphoid /</text>
    <text x="22" y="336">trapezium</text>
    <text x="352" y="98" font-weight="700">Guyon's canal</text>
    <text x="400" y="352">hook of</text>
    <text x="400" y="368">hamate</text>
    <text x="448" y="244">pisiform</text>
    <text x="40" y="504" font-weight="700" fill="#dc2626">Lunate dislocation → median n. ถูกกด</text>
  </g>
  <g stroke="#1f2937" stroke-width="1" fill="none" marker-end="url(#dot)">
    <path d="M140,116 L180,150"/>
    <path d="M90,152 L176,178"/>
    <path d="M60,306 L96,262"/>
    <path d="M396,104 L404,160"/>
    <path d="M410,340 L394,240"/>
    <path d="M462,232 L448,214"/>
    <path d="M444,122 L424,164"/>
    <path d="M470,142 L446,164"/>
  </g>
  <!-- ulnar n./a. labels -->
  <text x="470" y="116" font-size="13" font-weight="700" fill="#a16207" text-anchor="middle">Ulnar n.</text>
  <text x="474" y="136"  font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">Ulnar a.</text>
  <!-- carpal tunnel label -->
  <text x="22" y="384" font-size="14" font-weight="700" fill="#2563eb">Carpal tunnel</text>
  <text x="22" y="400" font-size="13" fill="#6b7280">(9 tendons + median n.)</text>
  <path d="M110,370 L176,232" stroke="#2563eb" stroke-width="1" fill="none" marker-end="url(#dot)"/>

  <!-- ===== RIGHT: palm with bursae ===== -->
  <text x="755" y="60" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">ฝ่ามือขวา: synovial sheath และ bursa</text>
  <g transform="translate(1400,0) scale(-1,1)">
  <!-- hand outline -->
  <path d="M612,300 L612,150 Q612,126 632,126 Q652,126 652,150 L652,292
           L664,292 L664,118 Q664,94 686,94 Q708,94 708,118 L708,292
           L718,292 L718,132 Q718,108 740,108 Q762,108 762,132 L762,298
           L772,300 L772,180 Q772,160 790,160 Q808,160 808,180 L808,330
           Q812,420 790,480 L790,560 L640,560 L640,488
           Q604,470 586,430 L548,330 Q536,300 556,292 Q574,288 586,310 L612,372 Z"
        fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <line x1="610" y1="488" x2="800" y2="488" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- short sheaths index/middle/ring -->
  <g fill="#db2777" fill-opacity=".22" stroke="#db2777" stroke-width="1.5">
    <rect x="620" y="140" width="24" height="152" rx="12"/>
    <rect x="674" y="108" width="24" height="182" rx="12"/>
    <rect x="728" y="122" width="24" height="170" rx="12"/>
  </g>
  <!-- ulnar bursa continuous with little finger sheath -->
  <path d="M778,172 Q778,166 790,166 Q802,166 802,176 L802,340 Q804,420 776,470 L770,540 L688,540 L684,470 Q664,400 676,320 Q700,306 778,318 Z"
        fill="#db2777" fill-opacity=".22" stroke="#db2777" stroke-width="1.5"/>
  <!-- radial bursa continuous with thumb sheath (FPL) -->
  <path d="M556,302 Q566,296 576,310 L614,394 Q636,440 650,476 L654,540 L630,540 L628,486 Q610,450 594,410 L552,318 Z"
        fill="#db2777" fill-opacity=".3" stroke="#db2777" stroke-width="1.5"/>

  <!-- horseshoe abscess path -->
  <path d="M790,190 L792,330 Q790,440 742,500 Q700,530 660,500 Q620,452 568,322" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#ar)"/>

  </g>
  <text x="800" y="492" font-size="13" fill="#6b7280">wrist</text>
  <g font-size="13" fill="#1f2937">
    <text x="522" y="520" font-weight="700" fill="#db2777">Ulnar bursa</text>
    <text x="522" y="536" fill="#db2777">(ต่อกับ sheath</text>
    <text x="522" y="552" fill="#db2777">นิ้วก้อย)</text>
    <text x="862" y="372" font-weight="700" fill="#db2777">Radial bursa</text>
    <text x="862" y="388" font-weight="700" fill="#db2777">(FPL)</text>
    <text x="826" y="120" font-weight="700">แยกจบ ไม่ต่อ</text>
    <text x="826" y="136" fill="#6b7280">(นิ้วชี้ กลาง นาง)</text>
    <text x="862" y="452" font-weight="700" fill="#dc2626">Horseshoe abscess</text>
    <text x="862" y="468" fill="#dc2626">นิ้วก้อย → ulnar</text>
    <text x="862" y="484" fill="#dc2626">→ radial → นิ้วโป้ง</text>
  </g>
  <g stroke="#1f2937" stroke-width="1" fill="none" marker-end="url(#dot)">
    <path d="M840,142 L770,270"/>
    <path d="M580,506 L640,450"/>
    <path d="M858,380 L800,370"/>
  </g>
</svg>
