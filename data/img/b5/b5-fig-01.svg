<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="tp" viewBox="0 0 4 18" refX="2" refY="9" markerWidth="4" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><rect width="4" height="18" fill="#7c3aed"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">Bone remodeling unit: RANKL / RANK / OPG</text>

  <!-- hormone boxes -->
  <g font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">
    <rect x="20" y="46" width="150" height="38" rx="6" fill="#2563eb" fill-opacity=".12" stroke="#2563eb"/>
    <text x="95" y="70">PTH (continuous)</text>
    <rect x="215" y="46" width="150" height="38" rx="6" fill="#2563eb" fill-opacity=".12" stroke="#2563eb"/>
    <text x="290" y="70">IL-1, IL-6, TNF-α</text>
    <rect x="390" y="46" width="110" height="38" rx="6" fill="#2563eb" fill-opacity=".12" stroke="#2563eb"/>
    <text x="445" y="70">Estrogen</text>
    <rect x="645" y="46" width="110" height="38" rx="6" fill="#2563eb" fill-opacity=".12" stroke="#2563eb"/>
    <text x="700" y="70">Calcitonin</text>
  </g>
  <g font-size="13" fill="#2563eb">
    <text x="106" y="104">↑RANKL ↓OPG</text>
    <text x="300" y="102">↑RANKL</text>
    <text x="386" y="200">↑OPG ↓RANKL</text>
  </g>
  <!-- Denosumab -->
  <rect x="790" y="40" width="190" height="50" rx="6" fill="#7c3aed" fill-opacity=".12" stroke="#7c3aed"/>
  <text x="885" y="60" font-size="14" font-weight="600" fill="#7c3aed" text-anchor="middle">Denosumab = anti-RANKL</text>
  <text x="885" y="80" font-size="13" fill="#7c3aed" text-anchor="middle">(เลียนแบบ OPG)</text>

  <!-- bone -->
  <path d="M0,450 L615,450 C640,452 650,490 700,492 L770,492 C820,490 835,452 860,450 L1000,450 L1000,590 L0,590 Z" fill="#E8DCC0" stroke="#1f2937" stroke-width="1.5"/>
  <!-- osteoid -->
  <rect x="95" y="440" width="238" height="10" fill="#db2777" fill-opacity=".2" stroke="#db2777" stroke-width=".8"/>

  <!-- osteoblasts -->
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a" fill-opacity=".18">
    <rect x="100" y="375" width="70" height="65" rx="6"/>
    <rect x="178" y="375" width="70" height="65" rx="6"/>
    <rect x="256" y="375" width="70" height="65" rx="6"/>
  </g>
  <g fill="#16a34a" fill-opacity=".55">
    <ellipse cx="135" cy="418" rx="13" ry="10"/>
    <ellipse cx="213" cy="418" rx="13" ry="10"/>
    <ellipse cx="291" cy="418" rx="13" ry="10"/>
  </g>
  <text x="15" y="404" font-size="15" font-weight="700" fill="#16a34a">Osteoblast</text>

  <!-- PTH1R on left osteoblast -->
  <path d="M112,375 L112,364 M106,358 L112,364 L118,358" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="20" y="366" font-size="13" fill="#2563eb">PTH1R</text>
  <line x1="95" y1="84" x2="111" y2="352" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- second RANKL captured by OPG on left osteoblast -->
  <line x1="152" y1="375" x2="152" y2="352" stroke="#16a34a" stroke-width="3"/>
  <rect x="145" y="343" width="14" height="10" rx="3" fill="#16a34a"/>
  <path d="M152,316 L152,330 M152,330 L141,345 M152,330 L163,345" stroke="#7c3aed" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="20" y="326" font-size="13" font-weight="600" fill="#7c3aed">OPG (decoy)</text>
  <line x1="100" y1="322" x2="138" y2="326" stroke="#7c3aed" stroke-width="1"/>

  <!-- M-CSF -->
  <circle cx="340" cy="414" r="5" fill="#2563eb"/>
  <circle cx="353" cy="424" r="5" fill="#2563eb"/>
  <text x="363" y="436" font-size="13" font-weight="600" fill="#2563eb">M-CSF</text>

  <!-- RANKL-RANK on middle osteoblast -->
  <line x1="213" y1="375" x2="213" y2="342" stroke="#16a34a" stroke-width="3"/>
  <rect x="206" y="332" width="14" height="10" rx="3" fill="#16a34a"/>
  <text x="222" y="364" font-size="13" font-weight="700" fill="#16a34a">RANKL</text>
  <!-- precursor -->
  <circle cx="213" cy="290" r="34" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/>
  <ellipse cx="213" cy="286" rx="13" ry="11" fill="#ea580c" fill-opacity=".5"/>
  <path d="M203,322 L203,331 M223,322 L223,331" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="336" font-size="13" font-weight="700" fill="#ea580c">RANK</text>
  <text x="213" y="232" font-size="13" fill="#1f2937" text-anchor="middle">Monocyte/macrophage</text>
  <text x="213" y="248" font-size="13" fill="#1f2937" text-anchor="middle">precursor</text>

  <!-- IL arrow, estrogen arrow -->
  <line x1="290" y1="84" x2="300" y2="363" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="410" y1="84" x2="330" y2="366" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>

  <!-- more precursors + fusion -->
  <line x1="248" y1="300" x2="420" y2="408" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#agr)"/>
  <circle cx="447" cy="428" r="21" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/>
  <circle cx="447" cy="428" r="8" fill="#ea580c" fill-opacity=".5"/>
  <circle cx="494" cy="428" r="21" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="2"/>
  <circle cx="494" cy="428" r="8" fill="#ea580c" fill-opacity=".5"/>
  <line x1="520" y1="410" x2="596" y2="398" stroke="#ea580c" stroke-width="3" marker-end="url(#ao)"/>
  <text x="556" y="392" font-size="14" font-weight="700" fill="#ea580c" text-anchor="middle">fusion</text>

  <!-- mature osteoclast -->
  <path d="M615,452 C600,420 610,350 660,335 C700,322 780,322 820,338 C865,355 875,420 858,452
           L845,462 L835,470 L825,462 L815,470 L805,462 L795,470 L785,462 L775,470 L765,462 L755,470 L745,462 L735,470 L725,462 L715,470 L705,462 L695,470 L685,462 L675,470 L665,462 L655,470 L645,462 L632,460 Z"
        fill="#ea580c" fill-opacity=".2" stroke="#ea580c" stroke-width="2.5"/>
  <g fill="#ea580c" fill-opacity=".6">
    <ellipse cx="680" cy="372" rx="13" ry="10"/>
    <ellipse cx="715" cy="362" rx="13" ry="10"/>
    <ellipse cx="752" cy="362" rx="13" ry="10"/>
    <ellipse cx="788" cy="370" rx="13" ry="10"/>
    <ellipse cx="700" cy="398" rx="13" ry="10"/>
    <ellipse cx="770" cy="398" rx="13" ry="10"/>
  </g>
  <text x="737" y="432" font-size="15" font-weight="700" fill="#ea580c" text-anchor="middle">Osteoclast</text>
  <text x="737" y="453" font-size="13" fill="#1f2937" text-anchor="middle">Ruffled border</text>
  <!-- calcitonin receptor + tee -->
  <path d="M720,326 L720,316 M714,310 L720,316 L726,310" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="720" y1="84" x2="720" y2="302" stroke="#7c3aed" stroke-width="2" marker-end="url(#tp)"/>
  <!-- estrogen tee to osteoclast -->
  <line x1="480" y1="84" x2="652" y2="330" stroke="#7c3aed" stroke-width="2" marker-end="url(#tp)"/>
  <text x="556" y="215" font-size="13" fill="#7c3aed" text-anchor="end">osteoclast</text>
  <text x="556" y="231" font-size="13" fill="#7c3aed" text-anchor="end">apoptosis</text>

  <!-- H+ and cathepsin arrows -->
  <line x1="690" y1="466" x2="690" y2="488" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="785" y1="466" x2="785" y2="488" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="737" y="514" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">H+ (carbonic anhydrase II)</text>
  <text x="737" y="532" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">Cathepsin K</text>
  <text x="737" y="560" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Howship lacuna</text>
  <!-- sealing zones -->
  <text x="612" y="474" font-size="13" fill="#1f2937" text-anchor="end">Sealing zone</text>
  <text x="864" y="474" font-size="13" fill="#1f2937">Sealing zone</text>

  <!-- osteocyte -->
  <g stroke="#16a34a" stroke-width="1.6" fill="none">
    <path d="M240,522 L215,458 M240,522 L262,456 M240,522 L195,500 M240,522 L285,505 M240,522 L210,560 M240,522 L272,562"/>
  </g>
  <ellipse cx="240" cy="522" rx="20" ry="11" fill="#16a34a" fill-opacity=".3" stroke="#16a34a" stroke-width="1.8"/>
  <text x="295" y="528" font-size="13" font-weight="600" fill="#16a34a">Osteocyte → sclerostin, FGF23</text>
  <text x="15" y="476" font-size="13" fill="#db2777" font-weight="600">Osteoid</text>
  <text x="15" y="492" font-size="13" fill="#db2777">(type I collagen)</text>

  <text x="500" y="625" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ถาม PTH receptor → osteoblast · ถามเซลล์ที่สลายกระดูก → osteoclast</text>
</svg>
