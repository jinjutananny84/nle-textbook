<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
<defs>
<linearGradient id="sev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset=".55" stop-color="#ea580c"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">บันไดการแปลผลน้ำไขข้อ (synovial fluid analysis)</text>

<!-- severity arrow over tubes 1-4 -->
<text x="402" y="58" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">ความรุนแรงของการอักเสบเพิ่มขึ้น →</text>
<rect x="40" y="68" width="716" height="7" rx="3.5" fill="url(#sev)"/>
<line x1="740" y1="71.5" x2="768" y2="71.5" stroke="#dc2626" stroke-width="7" marker-end="url(#ahr)"/>

<!-- top labels -->
<g font-size="15" font-weight="700" text-anchor="middle">
<text x="114" y="104" fill="#1f2937">Normal ปกติ</text>
<text x="306" y="104" fill="#0891b2">Non-inflammatory</text>
<text x="498" y="104" fill="#ea580c">Inflammatory</text>
<text x="690" y="104" fill="#dc2626" font-size="17">Septic</text>
<text x="882" y="104" fill="#7c3aed">Hemorrhagic</text>
</g>

<!-- tubes -->
<g stroke="#6b7280" stroke-width="2" fill="none">
<!-- 1 -->
<path d="M96,150 V250 A18,18 0 0 0 132,250 V150 Z" fill="#FFFFFF" stroke="none"/>
<line x1="96" y1="150" x2="132" y2="150" stroke-dasharray="3 3" stroke-width="1.2"/>
<path d="M94,116 V250 A20,20 0 0 0 134,250 V116"/>
<line x1="89" y1="116" x2="139" y2="116"/>
<!-- 2 -->
<path d="M288,150 V250 A18,18 0 0 0 324,250 V150 Z" fill="#F3E3A0" stroke="none"/>
<path d="M286,116 V250 A20,20 0 0 0 326,250 V116"/>
<line x1="281" y1="116" x2="331" y2="116"/>
<!-- 3 -->
<path d="M480,150 V250 A18,18 0 0 0 516,250 V150 Z" fill="#E9C46A" stroke="none"/>
<path d="M478,116 V250 A20,20 0 0 0 518,250 V116"/>
<line x1="473" y1="116" x2="523" y2="116"/>
<!-- 4 -->
<path d="M672,150 V250 A18,18 0 0 0 708,250 V150 Z" fill="#B9A443" stroke="none"/>
<path d="M670,116 V250 A20,20 0 0 0 710,250 V116"/>
<line x1="665" y1="116" x2="715" y2="116"/>
<!-- 5 -->
<path d="M864,150 V250 A18,18 0 0 0 900,250 V150 Z" fill="#9E2B25" stroke="none"/>
<path d="M862,116 V250 A20,20 0 0 0 902,250 V116"/>
<line x1="857" y1="116" x2="907" y2="116"/>
</g>
<!-- floating particles in tube 3 -->
<g fill="#1f2937" fill-opacity=".45">
<circle cx="487" cy="165" r="1.6"/><circle cx="503" cy="172" r="1.4"/><circle cx="494" cy="186" r="1.7"/><circle cx="510" cy="195" r="1.4"/>
<circle cx="486" cy="208" r="1.5"/><circle cx="500" cy="220" r="1.6"/><circle cx="511" cy="232" r="1.4"/><circle cx="490" cy="240" r="1.5"/>
<circle cx="499" cy="255" r="1.5"/><circle cx="506" cy="158" r="1.3"/>
</g>
<!-- glare -->
<g stroke="#ffffff" stroke-width="3" stroke-opacity=".7" stroke-linecap="round">
<line x1="294" y1="160" x2="294" y2="240"/><line x1="486" y1="160" x2="486" y2="240"/><line x1="678" y1="160" x2="678" y2="240"/><line x1="870" y1="160" x2="870" y2="240"/>
</g>

<!-- string sign beside tube 1 -->
<rect x="160" y="118" width="24" height="40" rx="12" fill="#ea580c" fill-opacity=".15" stroke="#1f2937" stroke-width="1.5"/>
<rect x="160" y="226" width="24" height="40" rx="12" fill="#ea580c" fill-opacity=".15" stroke="#1f2937" stroke-width="1.5"/>
<path d="M172,158 C168,180 176,200 172,226" stroke="#0891b2" stroke-width="2.2" fill="none"/>
<text x="114" y="294" font-size="13" font-weight="600" fill="#0891b2" text-anchor="middle">string sign ยาว =</text>
<text x="114" y="311" font-size="13" font-weight="600" fill="#0891b2" text-anchor="middle">hyaluronic acid ปกติ</text>

<!-- short broken drop beside tube 4 -->
<rect x="736" y="118" width="24" height="40" rx="12" fill="#ea580c" fill-opacity=".15" stroke="#1f2937" stroke-width="1.5"/>
<rect x="736" y="226" width="24" height="40" rx="12" fill="#ea580c" fill-opacity=".15" stroke="#1f2937" stroke-width="1.5"/>
<path d="M748,158 L748,166" stroke="#B9A443" stroke-width="2.2"/>
<path d="M748,178 C743,186 743,192 748,194 C753,192 753,186 748,178 Z" fill="#B9A443"/>
<path d="M748,226 L748,218" stroke="#B9A443" stroke-width="2.2"/>
<text x="690" y="294" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">หยดขาดสั้น =</text>
<text x="690" y="311" font-size="13" font-weight="600" fill="#dc2626" text-anchor="middle">ความหนืดลด</text>

<!-- boxes -->
<g stroke-width="1.5">
<rect x="24" y="324" width="180" height="80" rx="8" fill="#6b7280" fill-opacity=".1" stroke="#6b7280"/>
<rect x="216" y="324" width="180" height="80" rx="8" fill="#0891b2" fill-opacity=".1" stroke="#0891b2"/>
<rect x="408" y="324" width="180" height="80" rx="8" fill="#ea580c" fill-opacity=".1" stroke="#ea580c"/>
<rect x="600" y="324" width="180" height="80" rx="8" fill="#dc2626" fill-opacity=".1" stroke="#dc2626" stroke-width="2.5"/>
<rect x="792" y="324" width="180" height="80" rx="8" fill="#7c3aed" fill-opacity=".1" stroke="#7c3aed"/>
</g>
<g font-size="14" fill="#1f2937" text-anchor="middle">
<text x="114" y="347" font-weight="700">WBC &lt; 200</text><text x="114" y="369">PMN &lt; 25%</text><text x="114" y="391">ใส หนืดมาก</text>
<text x="306" y="347" font-weight="700">WBC 200–2,000</text><text x="306" y="369">PMN &lt; 25%</text><text x="306" y="391">OA, trauma</text>
<text x="498" y="347" font-weight="700">WBC 2,000–50,000</text><text x="498" y="369">PMN &gt; 50%</text><text x="498" y="391">RA, gout, CPPD, SpA</text>
<text x="690" y="347" font-weight="700">WBC &gt; 50,000</text><text x="690" y="369">PMN &gt; 75–90%</text><text x="690" y="391" fill="#dc2626" font-weight="600">Gram stain + culture</text>
<text x="882" y="347">trauma, hemophilia</text><text x="882" y="369">anticoagulant</text><text x="882" y="391">PVNS</text>
</g>

<!-- bottom bar -->
<rect x="24" y="426" width="948" height="46" rx="8" fill="#2563eb" fill-opacity=".1" stroke="#2563eb" stroke-width="1.5"/>
<text x="498" y="455" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">ส่งทุกครั้ง: cell count · Gram/culture · crystal (polarized light) — <tspan fill="#dc2626">พบ crystal ไม่ตัด septic</tspan></text>
</svg>
