<rect x="506" y="508" width="22" height="16" rx="3" fill="#0891b2" fill-opacity=".22" stroke="#0891b2"/><text x="536" y="521" font-size="13" fill="#1f2937"><tspan font-weight="700">L2</tspan> ต้นขาหน้าบน</text>
