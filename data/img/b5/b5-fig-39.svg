<rect x="506" y="548" width="22" height="16" rx="3" fill="#16a34a" fill-opacity=".35" stroke="#16a34a"/><text x="536" y="561" font-size="13" fill="#1f2937"><tspan font-weight="700">L4</tspan> สะบ้า → ขาด้านใน → medial malleolus</text>
<rect x="506" y="568" width="22" height="16" rx="3" fill="#eab308" fill-opacity=".45" stroke="#eab308"/><text x="536" y="581" font-size="13" fill="#1f2937"><tspan font-weight="700">L5</tspan> ขาด้านนอก → หลังเท้า → นิ้วโป้งเท้า</text>
<rect x="506" y="588" width="22" height="16" rx="3" fill="#ea580c" fill-opacity=".38" stroke="#ea580c"/><text x="536" y="601" font-size="13" fill="#1f2937"><tspan font-weight="700">S1</tspan> หลังน่อง → lateral malleolus → ขอบนอกเท้า/ฝ่าเท้า</text>
<rect x="506" y="608" width="22" height="16" rx="3" fill="#db2777" fill-opacity=".3" stroke="#db2777"/><text x="536" y="621" font-size="13" fill="#1f2937"><tspan font-weight="700">S2</tspan> หลังต้นขา</text>
