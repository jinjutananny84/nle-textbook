<text x="376" y="204" font-weight="700" fill="#dc2626">Posterolateral</text>
<text x="376" y="220" fill="#dc2626">(พบบ่อย) → L5</text>
<text x="22" y="200" font-weight="700" fill="#ea580c">Far lateral</text>
<text x="22" y="216" fill="#ea580c">→ L4</text>
<text x="370" y="306" font-weight="700" fill="#a16207">L4 exiting</text>
<text x="370" y="322" fill="#a16207">root (foramen)</text>
<text x="22" y="330" font-weight="700" fill="#a16207">L5 traversing root</text>
<text x="22" y="346" fill="#a16207">(lateral recess)</text>
<text x="22" y="410" fill="#7c3aed" font-weight="700">PLL</text>
<text x="22" y="426" fill="#7c3aed">หนากลาง บางที่ขอบ</text>
<text x="360" y="420" fill="#a16207">cauda equina</text>
</g>
