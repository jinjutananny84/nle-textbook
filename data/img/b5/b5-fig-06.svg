<text x="753" y="225" font-size="13" fill="#1f2937">ปลาย</text><text x="753" y="378" font-size="13" fill="#1f2937">ต้น</text>
<line x1="715" y1="300" x2="795" y2="300" stroke="#1f2937" stroke-width="1.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
<text x="715" y="292" font-size="13" fill="#1f2937">โป้ง</text>
<text x="765" y="140" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">AER — FGF → ต้น-ปลาย</text>
<text x="835" y="310" font-size="13" fill="#db2777" font-weight="700" text-anchor="start">ZPA</text>
<text x="865" y="326" font-size="13" fill="#db2777" font-weight="600" text-anchor="start"></text>
<text x="849" y="346" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">ก้อย</text>
<text x="645" y="446" font-size="13" fill="#db2777" font-weight="700" text-anchor="start">ZPA — Sonic hedgehog → หน้า-หลัง</text>
<text x="645" y="462" font-size="13" fill="#db2777" font-weight="400" text-anchor="start">(นิ้วโป้ง-นิ้วก้อย; ZPA อยู่ฝั่งนิ้วก้อย)</text>
<text x="645" y="496" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">HOX genes → ตำแหน่ง/เอกลักษณ์ของแต่ละส่วน</text>
<text x="645" y="92" font-size="13" fill="#16a34a" font-weight="700" text-anchor="start">Dorsal ectoderm (พื้นเขียว) — Wnt7a</text>
<text x="645" y="108" font-size="13" fill="#16a34a" font-weight="400" text-anchor="start">→ หลังมือ-ฝ่ามือ (dorsal-ventral)</text>
<polyline points="660,114 660,335 716,335" fill="none" stroke="#16a34a" stroke-width="1"/>
<rect x="15" y="526" width="970" height="100" rx="10" fill="#dc2626" fill-opacity=".07" stroke="#dc2626"/>
<text x="35" y="556" font-size="15" font-weight="700" fill="#dc2626">Critical period: สัปดาห์ 4–8</text>
<text x="35" y="580" font-size="15" font-weight="700" fill="#1f2937">Thalidomide → phocomelia</text>
<text x="35" y="604" font-size="13" fill="#6b7280">(แขนขาสั้น มือ/เท้าติดลำตัว)</text>
<rect x="321" y="548" width="18" height="56" rx="9" fill="#2563eb" fill-opacity=".18" stroke="#2563eb" stroke-width="1.5"/>
