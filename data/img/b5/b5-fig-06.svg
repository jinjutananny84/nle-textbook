<text x="378" y="572" font-size="14" font-weight="700" fill="#1f2937">แขนหมุนออก 90° (lateral)</text>
<text x="378" y="592" font-size="13" fill="#1f2937">→ ข้อศอกชี้ไปข้างหลัง</text>
<rect x="661" y="548" width="18" height="56" rx="9" fill="#2563eb" fill-opacity=".18" stroke="#2563eb" stroke-width="1.5"/>
<path d="M696,586 A28,14 0 1 1 644,586" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="718" y="572" font-size="14" font-weight="700" fill="#1f2937">ขาหมุนเข้า 90° (medial)</text>
<text x="718" y="592" font-size="13" fill="#1f2937">→ เข่าชี้ไปข้างหน้า, big toe อยู่ด้านใน</text>
