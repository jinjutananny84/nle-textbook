<text x="30" y="352" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Paraxial mesoderm (somite)</text>
<text x="300" y="352" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Intermediate / lateral plate</text>
<rect x="30" y="367" width="14" height="14" rx="3" fill="#6b7280" fill-opacity=".3" stroke="#6b7280"/>
<text x="52" y="378" font-size="13" fill="#1f2937">Notochord → nucleus pulposus</text>
<rect x="30" y="392" width="14" height="14" rx="3" fill="#dc2626" fill-opacity=".3" stroke="#dc2626"/>
<text x="52" y="403" font-size="13" fill="#1f2937">Dermatome → dermis หลัง</text>
<rect x="30" y="417" width="14" height="14" rx="3" fill="#dc2626" fill-opacity=".3" stroke="#dc2626"/>
<text x="52" y="428" font-size="13" fill="#1f2937">Myotome → skeletal muscle</text>
<rect x="30" y="442" width="14" height="14" rx="3" fill="#ea580c" fill-opacity=".3" stroke="#ea580c"/>
<text x="52" y="453" font-size="13" fill="#1f2937">Sclerotome → vertebra, rib</text>
<rect x="300" y="367" width="14" height="14" rx="3" fill="#16a34a" fill-opacity=".3" stroke="#16a34a"/>
<text x="322" y="378" font-size="13" fill="#1f2937">Intermediate → kidney, gonad</text>
<rect x="300" y="392" width="14" height="14" rx="3" fill="#7c3aed" fill-opacity=".3" stroke="#7c3aed"/>
<text x="322" y="403" font-size="13" fill="#1f2937">Somatic → limb bone, cartilage, tendon</text>
<rect x="300" y="417" width="14" height="14" rx="3" fill="#0891b2" fill-opacity=".3" stroke="#0891b2"/>
<text x="322" y="428" font-size="13" fill="#1f2937">Splanchnic → visceral smooth muscle, heart</text>
