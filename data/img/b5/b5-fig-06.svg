<text x="400" y="98" font-size="13" fill="#dc2626" font-weight="400" text-anchor="start">→ limb muscle (เช่น quadriceps)</text>
<text x="508" y="170" font-size="13" fill="#7c3aed" font-weight="600" text-anchor="start">Limb bud</text>
