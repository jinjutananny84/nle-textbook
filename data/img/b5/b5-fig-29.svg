<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="5" fill="#1f2937"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">ข้อศอกขวา (มองด้านหน้า): epicondyles และ pulled elbow</text>
  <text x="80" y="60" font-size="13" fill="#6b7280">lateral</text>
  <text x="520" y="60" font-size="13" fill="#6b7280" text-anchor="end">medial</text>
  <line x1="590" y1="44" x2="590" y2="566" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== LEFT PANEL ===== -->
  <!-- radius (lateral) + ulna (medial) -->
  <path d="M262,318 L300,318 L298,340 L290,350 L294,520 L268,520 L272,350 L262,340 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <path d="M312,312 Q330,330 356,312 L350,350 L334,520 L310,520 L312,350 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <!-- distal humerus -->
  <path d="M286,60 L330,60 L330,170 Q344,240 384,272 Q398,284 392,298 Q382,306 360,300 Q352,312 334,312 Q322,318 312,312 L300,316 Q278,320 262,312 Q244,304 236,290 Q226,280 240,262 Q270,230 286,170 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <text x="282" y="306" font-size="13" fill="#6b7280" text-anchor="middle">cap.</text>
  <text x="336" y="304" font-size="13" fill="#6b7280" text-anchor="middle">troch.</text>

  <!-- ECRL from supracondylar ridge -->
  <path d="M282,175 L270,250 L118,476 L92,466 Z" fill="#6b7280" fill-opacity=".22" stroke="#6b7280" stroke-width="1.5"/>
  <!-- extensor fan from lateral epicondyle -->
  <g stroke="#ea580c" stroke-width="1.5">
    <path d="M242,280 L250,292 L188,500 L166,498 Z" fill="#ea580c" fill-opacity=".55"/>
    <path d="M250,292 L256,300 L214,502 L190,500 Z" fill="#ea580c" fill-opacity=".2"/>
    <path d="M256,300 L260,306 L238,504 L216,502 Z" fill="#ea580c" fill-opacity=".2"/>
    <path d="M260,306 L262,312 L262,504 L240,504 Z" fill="#ea580c" fill-opacity=".2"/>
  </g>
  <!-- flexor fan from medial epicondyle -->
  <g stroke="#0891b2" stroke-width="1.5" fill="#0891b2" fill-opacity=".22">
    <path d="M384,276 L390,286 L348,500 L326,498 Z"/>
    <path d="M390,286 L394,294 L374,502 L352,500 Z"/>
    <path d="M394,294 L394,300 L400,502 L378,502 Z"/>
    <path d="M394,300 L390,306 L426,500 L404,502 Z"/>
  </g>
  <!-- ulnar n. behind medial epicondyle -->
  <path d="M392,80 L398,240" fill="none" stroke="#eab308" stroke-width="5"/>
  <path d="M398,240 Q408,290 392,320" fill="none" stroke="#eab308" stroke-width="5" stroke-dasharray="6 4"/>
  <path d="M392,320 L384,520" fill="none" stroke="#eab308" stroke-width="5"/>

  <!-- labels left panel -->
  <g font-size="13" fill="#1f2937">
    <text x="20" y="150" font-weight="700" fill="#6b7280">ECRL</text>
    <text x="20" y="166">(ridge — ไม่ใช่</text>
    <text x="20" y="182">common origin)</text>
    <text x="20" y="316" font-weight="700" fill="#ea580c">ECRB —</text>
    <text x="20" y="332" font-weight="700" fill="#ea580c">tennis elbow</text>
    <text x="20" y="530" font-weight="700">Common extensor origin:</text>
    <text x="20" y="548">ECRB, ED, EDM, ECU</text>
    <text x="20" y="252" fill="#6b7280">Lateral epicondyle</text>
    <text x="430" y="110" font-weight="700" fill="#a16207">Ulnar n.</text>
    <text x="430" y="126">(อ้อมหลัง medial</text>
    <text x="430" y="142">epicondyle)</text>
    <text x="440" y="250" fill="#6b7280">Medial</text>
    <text x="440" y="266" fill="#6b7280">epicondyle</text>
    <text x="350" y="530" font-weight="700">Common flexor origin:</text>
    <text x="350" y="548">PT, FCR, PL, FCU</text>
    <text x="350" y="566" fill="#0891b2" font-weight="700">Golfer's elbow</text>
  </g>
  <g stroke="#1f2937" stroke-width="1" fill="none" marker-end="url(#dot)">
    <path d="M118,170 L276,200"/>
    <path d="M110,322 L200,400"/>
    <path d="M140,248 L238,282"/>
    <path d="M426,114 L396,130"/>
    <path d="M436,256 L394,284"/>
  </g>

  <!-- ===== RIGHT PANEL: radial head enlarged ===== -->
  <text x="790" y="60" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">ภาพขยายหัว radius + annular ligament</text>
  <text x="690" y="90" font-size="14" font-weight="700" fill="#16a34a" text-anchor="middle">ปกติ</text>
  <text x="890" y="90" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Pulled elbow</text>

  <!-- NORMAL -->
  <path d="M640,100 L740,100 L740,128 Q690,152 640,128 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <text x="690" y="120" font-size="13" fill="#6b7280" text-anchor="middle">capitulum</text>
  <!-- ulna -->
  <path d="M726,150 L760,150 L756,400 L734,400 L730,210 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <!-- radius: head cylinder -->
  <path d="M656,162 L656,196 Q658,208 672,214 L674,400 L700,400 L702,214 Q716,208 718,196 L718,162" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <ellipse cx="687" cy="162" rx="31" ry="10" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <!-- annular ligament around head -->
  <path d="M730,170 Q700,166 664,168 Q648,172 650,184 Q652,194 670,196 L730,194" fill="none" stroke="#7c3aed" stroke-width="9" stroke-opacity=".75"/>
  <text x="690" y="440" font-size="13" fill="#1f2937" text-anchor="middle">ligament โอบหัว radius</text>
  <text x="690" y="456" font-size="13" fill="#1f2937" text-anchor="middle">แนบ ulna</text>

  <!-- PULLED -->
  <path d="M840,100 L940,100 L940,128 Q890,152 840,128 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <path d="M926,150 L960,150 L956,400 L934,400 L930,210 Z" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <!-- radius displaced distally -->
  <path d="M856,198 L856,232 Q858,244 872,250 L874,420 L900,420 L902,250 Q916,244 918,232 L918,198" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <ellipse cx="887" cy="198" rx="31" ry="10" fill="#E8DCC0" stroke="#6b7280" stroke-width="2"/>
  <!-- ligament folded into joint, above head -->
  <path d="M930,172 Q900,160 868,170 Q854,176 866,182 Q896,186 930,182" fill="none" stroke="#7c3aed" stroke-width="8" stroke-opacity=".75"/>
  <text x="826" y="176" font-size="13" fill="#7c3aed" text-anchor="end">ligament</text>
  <text x="826" y="192" font-size="13" fill="#7c3aed" text-anchor="end">พับเข้าข้อ</text>
  <!-- traction arrow -->
  <line x1="815" y1="260" x2="815" y2="350" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="808" y="290" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">traction</text>
  <text x="808" y="306" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">+ pronation</text>
  <text x="890" y="440" font-size="13" fill="#1f2937" text-anchor="middle">radial head subluxation —</text>
  <text x="890" y="456" font-size="13" fill="#1f2937" text-anchor="middle">proximal radioulnar joint</text>

  <rect x="610" y="488" width="370" height="40" rx="8" fill="#ea580c" fill-opacity=".1" stroke="#ea580c" stroke-width="1.5"/>
  <text x="795" y="513" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">เด็ก 1–4 ปี แขนคว่ำ งอเล็กน้อย หงายมือไม่ได้</text>
</svg>
