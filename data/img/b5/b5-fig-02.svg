      <ellipse cx="666" cy="481" rx="3.5" ry="6"/><ellipse cx="667" cy="508" rx="3.5" ry="6"/><ellipse cx="668" cy="535" rx="3.5" ry="6"/>
      <ellipse cx="687" cy="486" rx="3.5" ry="6"/><ellipse cx="686" cy="513" rx="3.5" ry="6"/><ellipse cx="685" cy="541" rx="3.5" ry="6"/>
      <ellipse cx="697" cy="481" rx="3.5" ry="6"/><ellipse cx="698" cy="508" rx="3.5" ry="6"/><ellipse cx="699" cy="535" rx="3.5" ry="6"/>
      <ellipse cx="718" cy="486" rx="3.5" ry="6"/><ellipse cx="717" cy="513" rx="3.5" ry="6"/><ellipse cx="716" cy="541" rx="3.5" ry="6"/>
    </g>
