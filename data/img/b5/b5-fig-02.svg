    <ellipse cx="628" cy="273" rx="12" ry="10"/><ellipse cx="628" cy="297" rx="12" ry="11"/><ellipse cx="628" cy="322" rx="12" ry="11"/><ellipse cx="628" cy="347" rx="12" ry="11"/>
