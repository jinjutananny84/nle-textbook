    <text x="232" y="136">ossification center</text>
    <line x1="230" y1="130" x2="186" y2="146" stroke="#1f2937" stroke-width="1"/>
    <text x="238" y="224" font-weight="600" fill="#0891b2">Epiphyseal</text>
    <text x="238" y="240" font-weight="600" fill="#0891b2">(growth) plate</text>
    <text x="190" y="452">Primary ossification</text>
    <text x="190" y="468">center (diaphysis)</text>
    <line x1="188" y1="455" x2="148" y2="470" stroke="#1f2937" stroke-width="1"/>
    <text x="60" y="64" font-weight="600">epiphysis</text>
