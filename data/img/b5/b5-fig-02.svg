    <ellipse cx="597" cy="373" rx="12" ry="10"/><ellipse cx="597" cy="398" rx="12" ry="11"/><ellipse cx="597" cy="423" rx="12" ry="11"/><ellipse cx="597" cy="447" rx="12" ry="10"/>
