  <!-- zone borders -->
  <rect x="580" y="60" width="160" height="500" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <g stroke="#1f2937" stroke-width="1" stroke-dasharray="4 3">
    <line x1="580" y1="160" x2="740" y2="160"/><line x1="580" y1="260" x2="740" y2="260"/>
    <line x1="580" y1="360" x2="740" y2="360"/><line x1="580" y1="460" x2="740" y2="460"/>
  </g>
  <!-- zone names -->
  <g font-size="14" font-weight="700" fill="#1f2937">
    <text x="752" y="115">1. Reserve (resting) zone</text>
    <text x="752" y="215">2. Proliferative zone</text>
    <text x="752" y="315">3. Hypertrophic zone</text>
    <text x="752" y="415">4. Zone of calcification</text>
    <text x="752" y="492">5. Zone of ossification</text>
  </g>
  <text x="752" y="514" font-size="13" fill="#16a34a" font-weight="600">Osteoblast สร้างกระดูก</text>
  <text x="752" y="531" font-size="13" fill="#16a34a" font-weight="600">บนแกน cartilage</text>
  <text x="752" y="550" font-size="13" fill="#dc2626">หลอดเลือดเข้าจากล่าง</text>
  <!-- role labels (left) -->
  <g font-size="13" text-anchor="end">
    <text x="568" y="196" fill="#2563eb" font-weight="600">GH/IGF-1, T3 → กระตุ้น</text>
    <text x="568" y="222" fill="#7c3aed" font-weight="600">FGFR3 ⊣ (achondroplasia</text>
    <text x="568" y="238" fill="#7c3aed" font-weight="600">= เบรกค้าง)</text>
    <text x="568" y="292" fill="#1f2937">type X collagen, VEGF</text>
    <text x="568" y="318" fill="#ea580c" font-weight="600">Rickets: โซนนี้หนาขึ้น</text>
    <text x="568" y="334" fill="#ea580c" font-weight="600">(PO4 ต่ำ เซลล์ไม่ตาย)</text>
  </g>
  <!-- growth direction arrow -->
  <line x1="962" y1="62" x2="962" y2="560" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ak)"/>
  <text transform="translate(982,310) rotate(90)" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">ทิศการเจริญ: กระดูกยาวขึ้น</text>

  <!-- bottom note box -->
  <rect x="30" y="604" width="560" height="88" rx="8" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-width="1.2"/>
  <g font-size="14" fill="#1f2937">
    <text x="46" y="630"><tspan font-weight="700">ยาวขึ้น</tspan> = chondrocyte ของ growth plate</text>
    <text x="46" y="654"><tspan font-weight="700">กว้างขึ้น</tspan> = osteoblast ของ periosteum (appositional)</text>
    <text x="46" y="678"><tspan font-weight="700" fill="#db2777">Estrogen ปิด plate</tspan> (ทั้งชายและหญิง)</text>
  </g>
