    <ellipse cx="660" cy="172" rx="11" ry="4"/><ellipse cx="660" cy="183" rx="11" ry="4"/><ellipse cx="660" cy="194" rx="11" ry="4"/><ellipse cx="660" cy="205" rx="11" ry="4"/><ellipse cx="660" cy="216" rx="11" ry="4"/><ellipse cx="660" cy="227" rx="11" ry="4"/><ellipse cx="660" cy="238" rx="11" ry="4"/><ellipse cx="660" cy="249" rx="11" ry="4"/>
