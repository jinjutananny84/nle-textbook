    <ellipse cx="660" cy="373" rx="12" ry="10"/><ellipse cx="660" cy="398" rx="12" ry="11"/><ellipse cx="660" cy="423" rx="12" ry="11"/><ellipse cx="660" cy="447" rx="12" ry="10"/>
    <ellipse cx="692" cy="373" rx="12" ry="10"/><ellipse cx="692" cy="398" rx="12" ry="11"/><ellipse cx="692" cy="423" rx="12" ry="11"/><ellipse cx="692" cy="447" rx="12" ry="10"/>
    <ellipse cx="723" cy="373" rx="12" ry="10"/><ellipse cx="723" cy="398" rx="12" ry="11"/><ellipse cx="723" cy="423" rx="12" ry="11"/><ellipse cx="723" cy="447" rx="12" ry="10"/>
