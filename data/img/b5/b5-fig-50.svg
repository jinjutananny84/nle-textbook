<text x="620" y="346" font-size="13"><tspan fill='#16a34a' font-weight='700'>Simple bone cyst / ABC / NOF</tspan></text>
<line x1="616.0" y1="342.0" x2="468.0" y2="362.0" stroke="#6b7280" stroke-width="1" />
<text x="620" y="372" font-size="13"><tspan fill='#16a34a' font-weight='700'>Osteochondroma</tspan><tspan fill='#6b7280' font-weight='400' dx='5'>[10–30 y]</tspan><tspan fill='#1f2937' font-weight='400' dx='5'>grows away from joint</tspan></text>
