<text x="620" y="420" font-size="13"><tspan fill='#dc2626' font-weight='700'>Osteosarcoma</tspan><tspan fill='#6b7280' font-weight='400' dx='5'>[10–20 y]</tspan><tspan fill='#1f2937' font-weight='400' dx='5'>Codman, sunburst</tspan></text>
<line x1="616.0" y1="416.0" x2="418.0" y2="412.0" stroke="#6b7280" stroke-width="1" />
<text x="620.0" y="494.0" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700" >— Epiphysis —</text>
<text x="620" y="520" font-size="13"><tspan fill='#ea580c' font-weight='700'>Giant cell tumor</tspan><tspan fill='#6b7280' font-weight='400' dx='5'>[20–40 y]</tspan><tspan fill='#1f2937' font-weight='400' dx='5'>soap bubble</tspan></text>
