<text x="620" y="118" font-size="13"><tspan fill='#dc2626' font-weight='700'>Ewing sarcoma</tspan><tspan fill='#6b7280' font-weight='400' dx='5'>[5–20 y]</tspan><tspan fill='#1f2937' font-weight='400' dx='5'>onion skin</tspan></text>
