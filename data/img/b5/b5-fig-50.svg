<text x="666.0" y="66.0" font-size="13" fill="#16a34a" text-anchor="start" font-weight="700" >benign</text>
<text x="720.0" y="66.0" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700" >intermediate</text>
