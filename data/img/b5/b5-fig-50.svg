<line x1="616.0" y1="162.0" x2="487.0" y2="246.0" stroke="#6b7280" stroke-width="1" />
<text x="620" y="142" font-size="13"><tspan fill='#16a34a' font-weight='700'>Fibrous dysplasia, LCH</tspan></text>
