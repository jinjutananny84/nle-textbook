<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">Brachial plexus 5 ชั้น (ขวา) — จากไขสันหลังไปแขน</text>

  <!-- column headers -->
  <g font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">
    <text x="150" y="60">Roots</text>
    <text x="285" y="60">Trunks</text>
    <text x="405" y="60">Divisions</text>
    <text x="555" y="60">Cords</text>
    <text x="895" y="60">Branches</text>
  </g>
  <g stroke="#6b7280" stroke-dasharray="2 4" stroke-width="1">
    <line x1="220" y1="68" x2="220" y2="470"/>
    <line x1="345" y1="68" x2="345" y2="470"/>
    <line x1="465" y1="68" x2="465" y2="470"/>
    <line x1="650" y1="68" x2="650" y2="470"/>
  </g>

  <!-- Erb ellipse (behind) -->
  <ellipse cx="285" cy="172" rx="80" ry="31" fill="#dc2626" fill-opacity=".08" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 4"/>
  <!-- Klumpke ellipse -->
  <ellipse cx="285" cy="328" rx="80" ry="31" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4"/>

  <!-- long thoracic (behind roots) -->
  <g fill="none" stroke="#6b7280" stroke-width="2">
    <path d="M128,150 C118,152 104,160 101,175"/>
    <path d="M128,195 C118,197 104,203 101,215"/>
    <path d="M128,250 C118,252 104,258 101,268"/>
    <path d="M101,175 L101,410" marker-end="url(#ag)"/>
  </g>

  <!-- roots -->
  <g fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round">
    <path d="M110,150 L195,150 C210,150 215,165 228,172"/>
    <path d="M110,195 L195,195 C210,195 215,180 228,172"/>
    <path d="M110,250 L228,250"/>
    <path d="M110,305 L195,305 C210,305 215,320 228,328"/>
    <path d="M110,350 L195,350 C210,350 215,336 228,328"/>
  </g>
  <g font-size="15" font-weight="700" fill="#1f2937" text-anchor="end">
    <text x="92" y="155">C5</text>
    <text x="92" y="200">C6</text>
    <text x="92" y="255">C7</text>
    <text x="92" y="310">C8</text>
    <text x="92" y="355">T1</text>
  </g>

  <!-- dorsal scapular -->
  <line x1="150" y1="148" x2="150" y2="96" stroke="#6b7280" stroke-width="2" marker-end="url(#ag)"/>
  <text x="112" y="86" font-size="13" fill="#1f2937">Dorsal scapular → rhomboids</text>

  <!-- trunks -->
  <g stroke-width="10" stroke-linecap="round">
    <line x1="228" y1="172" x2="342" y2="172" stroke="#0891b2"/>
    <line x1="228" y1="250" x2="342" y2="250" stroke="#16a34a"/>
    <line x1="228" y1="328" x2="342" y2="328" stroke="#7c3aed"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="285" y="196" fill="#0891b2">Upper trunk</text>
    <text x="285" y="274" fill="#16a34a">Middle trunk</text>
    <text x="285" y="350" fill="#7c3aed">Lower trunk</text>
  </g>

  <!-- suprascapular -->
  <line x1="336" y1="168" x2="372" y2="116" stroke="#0891b2" stroke-width="2.5" marker-end="url(#ac)"/>
  <text x="378" y="112" font-size="13" fill="#1f2937">Suprascapular (C5–6)</text>

  <!-- Erb label -->
  <text x="190" y="118" font-size="13" font-weight="700" fill="#dc2626">Erb palsy (C5–C6)</text>
  <text x="190" y="134" font-size="13" fill="#dc2626">— waiter's tip</text>

  <!-- divisions: anterior solid, posterior dashed -->
  <g fill="none" stroke-width="3.5">
    <!-- posterior (dashed) first -->
    <path d="M342,172 C400,180 420,255 470,260" stroke="#0891b2" stroke-dasharray="8 5"/>
    <path d="M342,250 C400,252 430,260 470,260" stroke="#16a34a" stroke-dasharray="8 5"/>
    <path d="M342,328 C400,320 420,265 470,260" stroke="#7c3aed" stroke-dasharray="8 5"/>
    <!-- anterior (solid) -->
    <path d="M342,172 C400,165 430,170 470,170" stroke="#0891b2"/>
    <path d="M342,250 C400,245 420,175 470,170" stroke="#16a34a"/>
    <path d="M342,328 C400,335 430,345 470,345" stroke="#7c3aed"/>
  </g>

  <!-- cords -->
  <g stroke-width="10" stroke-linecap="round">
    <line x1="470" y1="170" x2="640" y2="170" stroke="#ea580c"/>
    <line x1="470" y1="260" x2="640" y2="260" stroke="#eab308"/>
    <line x1="470" y1="345" x2="640" y2="345" stroke="#db2777"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="560" y="156" fill="#ea580c">Lateral cord</text>
    <text x="560" y="246" fill="#ca8a04">Posterior cord</text>
    <text x="560" y="370" fill="#db2777">Medial cord</text>
  </g>

  <!-- thoracodorsal -->
  <line x1="495" y1="264" x2="495" y2="292" stroke="#ca8a04" stroke-width="2.5" marker-end="url(#ay)"/>
  <text x="504" y="302" font-size="13" fill="#1f2937">Thoracodorsal</text>
  <text x="504" y="318" font-size="13" fill="#1f2937">→ latissimus dorsi</text>

  <!-- terminal branches -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M640,260 C700,260 730,212 800,212" stroke="#eab308"/>
    <path d="M640,260 C700,260 730,285 800,285" stroke="#eab308"/>
    <path d="M640,170 C700,170 730,132 800,132" stroke="#ea580c"/>
    <!-- M: lateral root of median (overpass with halo) -->
    <path d="M640,170 C690,175 705,320 735,360" stroke="#ffffff" stroke-width="10"/>
    <path d="M640,170 C690,175 705,320 735,360" stroke="#ea580c"/>
    <path d="M640,345 C690,345 715,355 735,360" stroke="#db2777"/>
    <path d="M735,360 L800,360" stroke="#2563eb" stroke-width="5"/>
    <path d="M640,345 C700,350 730,432 800,432" stroke="#db2777"/>
  </g>
  <circle cx="735" cy="360" r="5" fill="#2563eb"/>
  

  <!-- branch boxes -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="800" y="114" width="190" height="36" rx="6" fill="#ea580c" fill-opacity=".14" stroke="#ea580c" stroke-width="1.5"/>
    <text x="895" y="137" fill="#1f2937">Musculocutaneous (C5–7)</text>
    <rect x="800" y="194" width="190" height="36" rx="6" fill="#eab308" fill-opacity=".18" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="895" y="217" fill="#1f2937">Axillary (C5–6)</text>
    <rect x="800" y="267" width="190" height="36" rx="6" fill="#eab308" fill-opacity=".18" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="895" y="290" fill="#1f2937">Radial (C5–T1)</text>
    <rect x="800" y="342" width="190" height="36" rx="6" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="1.5"/>
    <text x="895" y="365" fill="#1f2937">Median (C5–T1)</text>
    <rect x="800" y="414" width="190" height="36" rx="6" fill="#db2777" fill-opacity=".14" stroke="#db2777" stroke-width="1.5"/>
    <text x="895" y="437" fill="#1f2937">Ulnar (C8–T1)</text>
  </g>

  <!-- Klumpke label -->
  <text x="190" y="384" font-size="13" font-weight="700" fill="#2563eb">Klumpke palsy (C8–T1)</text>
  <text x="190" y="400" font-size="13" fill="#2563eb">— claw hand ± Horner</text>

  <!-- long thoracic label -->
  <text x="30" y="432" font-size="13" fill="#1f2937">Long thoracic (C5–7) → serratus anterior</text>

  <!-- legend -->
  <g font-size="13" fill="#1f2937">
    <line x1="420" y1="496" x2="470" y2="496" stroke="#1f2937" stroke-width="3.5"/>
    <text x="478" y="501">anterior division (เส้นทึบ)</text>
    <line x1="420" y1="524" x2="470" y2="524" stroke="#1f2937" stroke-width="3.5" stroke-dasharray="8 5"/>
    <text x="478" y="529">posterior division (เส้นประ) → รวมเป็น posterior cord</text>
  </g>

  <!-- mnemonic -->
  <rect x="20" y="478" width="300" height="64" rx="8" fill="#7c3aed" fill-opacity=".1" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="503" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">Randy Travis Drinks Cold Beer</text>
  <text x="170" y="526" font-size="13" fill="#1f2937" text-anchor="middle">Roots · Trunks · Divisions · Cords · Branches</text>
</svg>
