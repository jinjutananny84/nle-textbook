<g font-size="13" fill="#1f2937">
<text x="20" y="80" font-weight="700" fill="#dc2626">ACL — กัน tibia เลื่อนไปหน้า</text>
<text x="20" y="96" fill="#dc2626">(anterior drawer / Lachman)</text>
<text x="350" y="80" font-weight="700" fill="#2563eb">PCL — กัน tibia</text>
<text x="350" y="96" font-weight="700" fill="#2563eb">เลื่อนไปหลัง</text>
<text x="350" y="112" fill="#2563eb">(posterior drawer)</text>
<text x="20" y="186" font-weight="700" fill="#ea580c">LCL — กัน varus</text>
<text x="20" y="202" fill="#ea580c">(เส้นกลม ไป</text>
<text x="20" y="218" fill="#ea580c">หัว fibula)</text>
<text x="20" y="250" font-weight="700" fill="#0891b2">Lateral</text>
<text x="20" y="266" font-weight="700" fill="#0891b2">meniscus</text>
<text x="20" y="282" fill="#0891b2">(O-shape)</text>
<text x="20" y="360" font-weight="700" fill="#6b7280">Iliotibial tract</text>
<text x="20" y="376" fill="#6b7280">(lateral — ตัวลวง)</text>
<text x="412" y="182" font-weight="700" fill="#16a34a">MCL — กัน valgus</text>
<text x="412" y="198" fill="#16a34a">(แถบกว้าง ติด</text>
<text x="412" y="214" fill="#16a34a">medial meniscus)</text>
<text x="412" y="242" font-weight="700" fill="#0891b2">Medial meniscus</text>
<text x="412" y="258" fill="#0891b2">(C-shape, ติด MCL</text>
<text x="412" y="274" fill="#0891b2">— ฉีกบ่อย)</text>
<text x="412" y="410" font-weight="700" fill="#7c3aed">Pes anserinus:</text>
<text x="412" y="426" fill="#7c3aed">Sartorius, Gracilis,</text>
<text x="412" y="442" fill="#7c3aed">semiTendinosus (SGT)</text>
</g>
