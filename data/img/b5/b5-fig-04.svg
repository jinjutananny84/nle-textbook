<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="18" font-weight="700" fill="#1f2937">การสร้าง collagen และโรคที่เสียแต่ละขั้น</text>
<rect x="15" y="44" width="630" height="442" rx="28" fill="#6b7280" fill-opacity=".05" stroke="#6b7280" stroke-width="3"/>
<text x="40" y="72" font-size="15" font-weight="700" fill="#6b7280">Fibroblast / osteoblast (ในเซลล์)</text>
<text x="665" y="72" font-size="15" font-weight="700" fill="#6b7280">Extracellular (นอกเซลล์)</text>
<rect x="665" y="90" width="310" height="96" rx="8" fill="none" stroke="#6b7280" stroke-dasharray="4 3"/>
<rect x="680" y="104" width="22" height="16" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
