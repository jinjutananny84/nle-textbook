<text x="737" y="144" font-size="13" fill="#1f2937">= โรคที่เกิดเมื่อขั้นนั้นเสีย</text>
<circle cx="690" cy="166" r="6" fill="#ea580c"/>
<text x="712" y="171" font-size="13" fill="#1f2937">= cofactor ที่ต้องใช้</text>

