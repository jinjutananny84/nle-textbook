<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141b36"/>
      <stop offset="65%" stop-color="#282952"/>
      <stop offset="100%" stop-color="#5a3b6e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#f284b6"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9" fill="url(#bg)"/>
  <rect x="1" y="1" width="38" height="38" rx="8" fill="none" stroke="url(#glow)" stroke-opacity=".55" stroke-width="1.2"/>
  <!-- Crescent moon & stars -->
  <path d="M10.5 7.2a4 4 0 1 0 4.5 5.4 3.2 3.2 0 1 1-4.5-5.4z" fill="#ffe28a"/>
  <circle cx="30" cy="8.5" r=".9" fill="#eef2ff" opacity=".85"/>
  <circle cx="25.5" cy="6.2" r=".6" fill="#5eead4" opacity=".9"/>
  <!-- Isometric Monument Spire -->
  <!-- Base right wall -->
  <polygon points="20,21 31,26.5 31,37 20,37" fill="#2c355c"/>
  <!-- Base left wall -->
  <polygon points="9,26.5 20,21 20,37 9,37" fill="#434d7a"/>
  <!-- Top terrace -->
  <polygon points="20,16 31,21.5 20,27 9,21.5" fill="#9fb2de"/>
  <!-- Upper tower -->
  <polygon points="20,9 26,12 26,20.5 20,17.5" fill="#7068a6"/>
  <polygon points="14,12 20,9 20,17.5 14,20.5" fill="#a893d4"/>
  <!-- Spire cap -->
  <polygon points="20,4.5 25,11 20,13.5 15,11" fill="#f284b6"/>
  <!-- Glowing arch doorway -->
  <path d="M18.3 20.5v-3.5a1.7 1.7 0 0 1 3.4 0v3.5z" fill="#ffe28a"/>
  <!-- Glowing cyan isometric stair trim -->
  <polyline points="10.5,22 20,26.8 29.5,22" fill="none" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Luminous white minimal traveler -->
  <polygon points="14.5,17.8 16.4,22 12.6,22" fill="#ffffff"/>
  <polygon points="14.5,14.6 16.1,18.2 12.9,18.2" fill="#ffffff"/>
</svg>
